services:
  celery1:
    build:
      context: demo/celery
    environment:
      BROKER_URL: redis://redis:6379/0
    deploy:
      mode: replicated
      replicas: 3
    stdin_open: true
    tty: true
    depends_on:
      - redis

  celery2:
    build:
      context: demo/celery
    environment:
      BROKER_URL: redis://redis:6379/0
    deploy:
      mode: replicated
      replicas: 3
    stdin_open: true
    tty: true
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    ports:
      - "26379:6379"

  memcached:
    image: "memcached:alpine3.21"
    ports:
      - "21121:11211"

  http:
    image: "kennethreitz/httpbin"
    ports:
      - "28000:80"

  ftp:
    image: "delfer/alpine-ftp-server"
    ports:
      - "2221:21"
      - "21000-21010:21000-21010"
    environment:
      ADDRESS: "localhost"

  mariadb:
    image: "bitnami/mariadb"
    ports:
      - "23306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: password

  ssh:
    image: "ddev/test-ssh-server:v1.22.2"
    ports:
      - "2222:22"
    environment:
      USERS: "user|password"
      ADDRESS: localhost

#  postgres:
#    image: "postgres:alpine"
#    ports:
#      - "25432:5432"
#    environment:
#      POSTGRES_HOST_AUTH_METHOD=trust: 1
#      POSTGRES_PASSWORD: pwd

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "25672:5672"
      - "21567:15672"
  ldap:
    image: bitnami/openldap
    ports:
      - '1389:1389'
      - '1636:1636'
    environment:
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: password
      LDAP_USERS: user
      LDAP_PASSWORDS: password
      LDAP_ROOT: dc=birder,dc=org
      LDAP_ADMIN_DN: cn=admin,dc=birder,dc=org

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: testpass
      MONGO_INITDB_DATABASE: testdb

  smtp:
    image: bytemark/smtp
    restart: always
    ports:
      - "2560:25"
    environment:
      RELAY_HOST: smtp.example.com
      RELAY_PORT: 587
      RELAY_USERNAME: admin@example.com
      RELAY_PASSWORD: password

#  valkey:
#    image: valkey/valkey:alpine
#    restart: always
#    ports:
#      - "2587:25"
#    environment:
#      RELAY_HOST: smtp.example.com
#      RELAY_PORT: 587
#      RELAY_USERNAME: admin
#      RELAY_PASSWORD: password

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_ACCESS_KEY: AKIAIOSFODNN7EXAMPLE
      MINIO_SECRET_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY


  elasticsearch:
#    image: elasticsearch:8.14.0
    image: bitnami/elasticsearch:8.14.0
    platform: linux/amd64
    ports:
      - "19200:9200"
      - "19300:9300"
    environment:
      "discovery.type": single-node
      "cluster.routing.allocation.disk.threshold_enabled": false


  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 AKIAIOSFODNN7EXAMPLE wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY;
      /usr/bin/mc rm -r --force myminio/bucket1;
      /usr/bin/mc mb myminio/bucket1;
      /usr/bin/mc policy set download myminio/bucket1;
      exit 0;
      "
