---
name: Build Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pypi version to install'
        required: true
      tag:
        description: 'Docker tag'
        required: false
      latest:
        description: 'Is this the latest docker image'
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  attestations: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set target input
        id: inputs
        run: |
          version="${{ github.event.inputs.version }}"
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$version"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: package
          path: docker/conf
          pattern: '*.whl'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64
      - name:
      - name: Build and push tag ${{ steps.inputs.outputs.tag }} (v${{ steps.inputs.outputs.version }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            os4d/birder:${{ steps.inputs.outputs.tag }}
            ${{ github.event.inputs.latest && "os4d/birder:latest" || null}}
          build-args: VERSION=${{ steps.inputs.outputs.version }}
